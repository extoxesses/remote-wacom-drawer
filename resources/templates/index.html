<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Wacom Drawer</title>
    <link rel="shortcut icon" href="{{url_for('static', filename='favicon.ico')}}">
    <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>Remote Wacom Drawer</h1>
            <div id="controls">
                <button onclick="window.location.href='/api/v1/drawer'">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/>
                        <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                    Draw
                </button>
                <button onclick="window.location.href='/api/v1/viewer'">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    View
                </button>
            </div>
        </div>
        <div id="drawingCanvasContainer">
            <h2>Welcome to Remote Wacom Drawer</h2>
            <p>Please select whether you want to draw or view drawings.</p>
        </div>
    </div>
</body>
</html>
