<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote wacom drawer</title>
    
    <link rel="shortcut icon" href="{{url_for('static', filename='favicon.ico')}}">
    <link rel="stylesheet" href="/static/css/base.css">

    <!-- TODO: Add integrity -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="/static/js/canvas_utils.js"></script>
    <script src="/static/js/websocket_utils.js"></script>
    <script src="/static/js/drawer.js"></script>
</head>
<body>
    <div id="container">
        <!-- Sidebar -->
        <div id="sidebar">
            <h1>Remote Drawer</h1>
            <hr/>
            <div id="credentials">
                <div>
                    <label for="drawerId">Id:</label>
                    <label id="drawerId"></label>
                </div>
                <div>
                    <label for="drawerSecret">Secret:</label>
                    <label id="drawerSecret"></label>
                </div>
            </div>
            <hr/>
            <div id="controls">
                <button id="connectButton">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reconnect
                </button>
                <button id="calibrateButton">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Calibrate
                </button>
                <button id="cleanButton">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Clean
                </button>
                <div class="switch-container">
                    <label for="blackboardModeSwitch">Blackboard Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="blackboardModeSwitch">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="drawingCanvasContainer">
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>

    <script>
        startDrawer('{{drawer_button}}', '{{eraser_button}}');
    </script>
</body>
</html>
