<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f7f6f3;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .controls {
            width: 240px;
            background: #ffffff;
            padding: 24px;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 1px 0 2px rgba(0, 0, 0, 0.05);
        }

        canvas {
            background: #ffffff;
            flex: 1;
            height: 100%;
            margin: 24px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #37352f;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        button {
            padding: 8px 12px;
            background: #ffffff;
            color: #37352f;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #f7f6f3;
            border-color: #d0d0d0;
        }

        button:active {
            background: #ebebea;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
        }

        .switch-container label {
            font-size: 14px;
            color: #37352f;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e0e0e0;
            transition: 0.4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #37352f;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        .icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>Drawer</h1>
            <button id="calibrateBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Calibra
            </button>
            <button id="clearBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Cancella
            </button>
            <button id="reconnectBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Riconetti
            </button>
            <div class="switch-container">
                <label>Mirror</label>
                <label class="switch">
                    <input type="checkbox" id="mirrorToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <canvas id="myCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const mirrorToggle = document.getElementById('mirrorToggle');

        let mouse = { x: -100, y: -100 };
        let trail = [];
        const trailLength = 20;
        const shadowColor = 'rgba(0, 0, 0, 0.1)';

        function resizeCanvas() {
            const container = document.querySelector('.container');
            canvas.width = container.clientWidth - 240;
            canvas.height = container.clientHeight - 48;
        }

        function draw() {
            // Sfondo
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (mirrorToggle.checked) {
                // Modalità mirror
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                drawCursor();
                ctx.restore();
            } else {
                // Modalità ombra
                drawTrail();
                drawCursor();
            }
        }

        function drawCursor() {
            ctx.fillStyle = '#2196F3';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTrail() {
            for (let i = 0; i < trail.length; i++) {
                const alpha = (i / trail.length) * 0.5;
                const radius = 10 * (1 - i / trail.length);
                
                ctx.fillStyle = `rgba(33, 150, 243, ${alpha})`;
                ctx.beginPath();
                ctx.arc(trail[i].x, trail[i].y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateTrail() {
            trail.push({ x: mouse.x, y: mouse.y });
            if (trail.length > trailLength) {
                trail.shift();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            draw();
            if (!mirrorToggle.checked) {
                updateTrail();
            }
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        resizeCanvas();
        animate();
    </script>
</body>
</html>
