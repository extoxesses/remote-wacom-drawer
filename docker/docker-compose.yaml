version: '3.7'
name: remote-drawer
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
  redisinsight:
    image: redislabs/redisinsight
    ports:
      - "5540:5540"